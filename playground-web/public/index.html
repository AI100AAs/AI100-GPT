<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- No analytics tag here on purpose. The upstream project shipped one
         pointing at its own Google property; this page tells students their
         writing never leaves the device, so it loads nothing third-party. -->
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <title>AI100-GPT</title>
    <meta property="og:title" content="AI100-GPT" />
    <meta name="twitter:title" content="AI100-GPT" />

    <meta name="description" content="A character-level GPT that trains and runs entirely in your browser, built for UBC's AI 100." />
    <meta property="og:description" content="A character-level GPT that trains and runs entirely in your browser, built for UBC's AI 100." />
    <meta name="twitter:description" content="A character-level GPT that trains and runs entirely in your browser, built for UBC's AI 100." />

    <!-- Social preview image and canonical URL are deliberately relative /
         absent until this is deployed somewhere. The upstream project pointed
         all three at its author's own domain, which would have shown his cover
         art and his Twitter handle on every link to this page. -->
    <meta name="twitter:card" content="summary" />
  </head>
